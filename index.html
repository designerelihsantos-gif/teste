<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Ordem de Serviço</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #eef1f5; margin: 0; padding: 20px; color: #222; }
  .toolbar { max-width: 900px; margin: 0 auto 15px; display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; color: #fff; }
  .btn-azul { background: #1e5bb8; } .btn-verde { background: #1f9d55; }
  .btn-cinza { background: #6b7280; } .btn-vermelho { background: #c53030; }
  .folha { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1e5bb8; padding-bottom: 12px; margin-bottom: 15px; gap: 15px; }
  header .empresa input { font-size: 13px; }
  header .empresa input.nome { font-size: 22px; font-weight: bold; color: #1e5bb8; }
  .numero { text-align: right; }
  .numero h1 { margin: 0; font-size: 20px; }
  .numero span { font-size: 26px; color: #c53030; font-weight: bold; }
  h2 { font-size: 14px; background: #1e5bb8; color: #fff; padding: 6px 10px; margin: 18px 0 8px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; }
  label { font-size: 11px; color: #555; display: block; margin-bottom: 2px; }
  input, select, textarea { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
  textarea { resize: vertical; min-height: 55px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f0f3f8; text-align: left; padding: 6px; border: 1px solid #ddd; }
  td { border: 1px solid #ddd; padding: 3px; }
  td input { border: none; }
  .remover { background: #c53030; color: #fff; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
  .totais { margin-top: 10px; display: flex; justify-content: flex-end; gap: 20px; font-size: 14px; align-items: center; }
  .totais input { width: 110px; }
  .total-geral { font-size: 18px; font-weight: bold; color: #1f9d55; }
  .assinaturas { display: flex; gap: 40px; margin-top: 50px; }
  .assinaturas div { flex: 1; border-top: 1px solid #000; text-align: center; padding-top: 5px; font-size: 12px; }
  @media (max-width: 650px) { .grid { grid-template-columns: 1fr 1fr; } .c3, .c4 { grid-column: span 2; } }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .no-print { display: none !important; }
    .folha { box-shadow: none; padding: 0; }
    input, select, textarea { border: none; padding: 2px 0; }
    textarea { resize: none; }
    h2 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-azul" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <button class="btn-verde" onclick="salvar()">💾 Salvar</button>
  <button class="btn-cinza" onclick="novaOS()">➕ Nova OS</button>
  <button class="btn-vermelho" onclick="limparTudo()">🗑️ Limpar tudo</button>
</div>

<div class="folha" id="folha">
  <header>
    <div class="empresa" style="flex:1">
      <input class="nome campo-empresa" id="emp_nome" placeholder="Nome da sua empresa">
      <input class="campo-empresa" id="emp_dados" placeholder="CNPJ • Telefone • E-mail">
      <input class="campo-empresa" id="emp_end" placeholder="Endereço da empresa">
    </div>
    <div class="numero">
      <h1>ORDEM DE SERVIÇO</h1>
      Nº <span id="numOS">0001</span>
    </div>
  </header>

  <div class="grid">
    <div><label>Data de entrada</label><input type="date" id="data_entrada"></div>
    <div><label>Previsão de entrega</label><input type="date" id="data_prev"></div>
    <div><label>Status</label>
      <select id="status">
        <option>Aberta</option><option>Em análise</option><option>Aguardando aprovação</option>
        <option>Aguardando peça</option><option>Em execução</option><option>Concluída</option>
        <option>Entregue</option><option>Cancelada</option>
      </select>
    </div>
    <div><label>Técnico responsável</label><input id="tecnico"></div>
  </div>

  <h2>DADOS DO CLIENTE</h2>
  <div class="grid">
    <div class="c2"><label>Nome / Razão social</label><input id="cli_nome"></div>
    <div><label>CPF / CNPJ</label><input id="cli_doc"></div>
    <div><label>Telefone / WhatsApp</label><input id="cli_tel"></div>
    <div class="c3"><label>Endereço</label><input id="cli_end"></div>
    <div><label>E-mail</label><input id="cli_email"></div>
  </div>

  <h2>EQUIPAMENTO / SERVIÇO</h2>
  <div class="grid">
    <div><label>Equipamento</label><input id="eq_tipo"></div>
    <div><label>Marca</label><input id="eq_marca"></div>
    <div><label>Modelo</label><input id="eq_modelo"></div>
    <div><label>Nº de série</label><input id="eq_serie"></div>
    <div class="c4"><label>Acessórios entregues</label><input id="eq_acess"></div>
    <div class="c2"><label>Defeito relatado pelo cliente</label><textarea id="defeito"></textarea></div>
    <div class="c2"><label>Diagnóstico / Laudo técnico</label><textarea id="laudo"></textarea></div>
  </div>

  <h2>SERVIÇOS E PEÇAS</h2>
  <table>
    <thead>
      <tr><th>Descrição</th><th style="width:70px">Qtd</th><th style="width:110px">Valor unit.</th><th style="width:110px">Subtotal</th><th class="no-print" style="width:40px"></th></tr>
    </thead>
    <tbody id="itens"></tbody>
  </table>
  <button class="no-print btn-azul" style="margin-top:8px;padding:6px 12px;border:none;border-radius:4px;color:#fff;cursor:pointer" onclick="addItem()">+ Adicionar item</button>

  <div class="totais">
    <div>Desconto (R$): <input type="number" id="desconto" value="0" step="0.01" oninput="calcular()"></div>
    <div class="total-geral">TOTAL: <span id="total">R$ 0,00</span></div>
  </div>

  <h2>OBSERVAÇÕES / GARANTIA</h2>
  <textarea id="obs">Garantia de 90 dias para os serviços executados. Equipamentos não retirados em até 90 dias após a conclusão poderão ser descartados.</textarea>
  <div class="grid" style="margin-top:8px">
    <div class="c2"><label>Forma de pagamento</label><input id="pagamento" placeholder="Pix, dinheiro, cartão..."></div>
  </div>

  <div class="assinaturas">
    <div>Assinatura do cliente</div>
    <div>Assinatura do técnico</div>
  </div>
</div>

<script>
  const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  function addItem(desc = '', qtd = 1, valor = 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="i-desc" value="${desc}"></td>
      <td><input class="i-qtd" type="number" min="0" value="${qtd}" oninput="calcular()"></td>
      <td><input class="i-valor" type="number" step="0.01" value="${valor}" oninput="calcular()"></td>
      <td class="i-sub">R$ 0,00</td>
      <td class="no-print"><button class="remover" onclick="this.closest('tr').remove(); calcular()">✕</button></td>`;
    document.getElementById('itens').appendChild(tr);
    calcular();
  }

  function calcular() {
    let total = 0;
    document.querySelectorAll('#itens tr').forEach(tr => {
      const q = parseFloat(tr.querySelector('.i-qtd').value) || 0;
      const v = parseFloat(tr.querySelector('.i-valor').value) || 0;
      tr.querySelector('.i-sub').textContent = brl(q * v);
      total += q * v;
    });
    total -= parseFloat(document.getElementById('desconto').value) || 0;
    document.getElementById('total').textContent = brl(Math.max(total, 0));
  }

  // Salva os dados no navegador (localStorage)
  function salvar() {
    const dados = { campos: {}, itens: [] };
    document.querySelectorAll('#folha input[id], #folha select, #folha textarea').forEach(el => dados.campos[el.id] = el.value);
    document.querySelectorAll('#itens tr').forEach(tr => dados.itens.push({
      desc: tr.querySelector('.i-desc').value,
      qtd: tr.querySelector('.i-qtd').value,
      valor: tr.querySelector('.i-valor').value
    }));
    localStorage.setItem('os_atual', JSON.stringify(dados));
    salvarEmpresa();
    alert('OS salva neste navegador!');
  }

  function salvarEmpresa() {
    const emp = {};
    document.querySelectorAll('.campo-empresa').forEach(el => emp[el.id] = el.value);
    localStorage.setItem('os_empresa', JSON.stringify(emp));
  }

  function carregar() {
    const emp = JSON.parse(localStorage.getItem('os_empresa') || '{}');
    Object.entries(emp).forEach(([id, v]) => document.getElementById(id).value = v);

    const num = parseInt(localStorage.getItem('os_numero') || '1');
    document.getElementById('numOS').textContent = String(num).padStart(4, '0');

    const dados = JSON.parse(localStorage.getItem('os_atual') || 'null');
    if (dados) {
      Object.entries(dados.campos).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
      dados.itens.forEach(i => addItem(i.desc, i.qtd, i.valor));
    } else {
      document.getElementById('data_entrada').valueAsDate = new Date();
      addItem();
    }
    calcular();
  }

  // Nova OS: incrementa o número e limpa os dados do cliente (mantém os da empresa)
  function novaOS() {
    if (!confirm('Iniciar uma nova OS? Os dados atuais serão apagados (imprima/salve antes).')) return;
    salvarEmpresa();
    const num = parseInt(localStorage.getItem('os_numero') || '1') + 1;
    localStorage.setItem('os_numero', num);
    localStorage.removeItem('os_atual');
    location.reload();
  }

  function limparTudo() {
    if (!confirm('Apagar TUDO, inclusive dados da empresa e numeração?')) return;
    localStorage.clear();
    location.reload();
  }

  document.querySelectorAll('.campo-empresa').forEach(el => el.addEventListener('change', salvarEmpresa));
  carregar();
</script>
</body>
</html>
